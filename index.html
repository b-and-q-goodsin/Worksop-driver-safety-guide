<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Worksop inbound driver safety information pilot"><title>Worksop Driver Safety Pilot</title>
<style>
:root{--navy:#073763;--blue:#0b5cab;--amber:#f5b400;--red:#b3261e;--green:#137333;--pale:#eef3f7;--ink:#17202a;--line:#d8e1e8}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.app{max-width:540px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 25px #0002;padding-bottom:92px}
.top{position:sticky;top:0;z-index:3}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.mark{width:58px;height:58px;flex:0 0 58px;border:1px solid rgba(255,255,255,.55);border-radius:14px;background:linear-gradient(145deg,#ffffff 0%,#eaf3ff 100%);color:var(--navy);box-shadow:0 5px 14px rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.mark strong{font-size:21px;letter-spacing:.08em;margin-left:.08em}
.mark em{font-style:normal;font-size:8px;letter-spacing:.18em;margin-top:5px;font-weight:800}
.mark::after{content:"";width:30px;height:2px;background:var(--blue);border-radius:2px;margin-top:4px}
header b{font-size:24px;letter-spacing:.02em;line-height:1.1}
header small{display:block;margin-top:5px;font-size:14px;font-weight:700;opacity:.95}
.bar{height:6px;background:#dce4ea}
.bar i{display:block;height:100%;width:14.29%;background:var(--amber);transition:width .2s}
main{padding:22px 20px}
.screen{display:none}.screen.active{display:block}
h1,h2{color:var(--navy)}
h1{font-size:28px;line-height:1.15;overflow-wrap:anywhere}
p{line-height:1.5}
.note{background:#fff4ce;border-left:5px solid var(--amber);padding:14px;border-radius:6px;margin:18px 0;line-height:1.45}
.rule{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.num{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800}
.rule h3{margin:0 0 5px;font-size:17px}
.rule p{margin:0;font-size:15px}
.actions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:13px 20px calc(13px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;z-index:4}
button{border:0;border-radius:8px;padding:15px 12px;font-weight:800;font-size:16px;font-family:inherit}
.primary{background:var(--blue);color:#fff;flex:1}
.secondary{background:#e8edf1;color:var(--navy);flex:1}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang{background:#eaf3ff;color:var(--navy);border:2px solid var(--blue);font-size:18px;padding:18px 12px}
.lang span{display:block;font-size:11px;font-weight:400;margin-top:4px;color:#5f6b76}
.lang:disabled{background:#f0f2f4;border-color:#d5dce2;color:#6c7580}
.check{display:flex;gap:10px;padding:14px;border:2px solid var(--line);border-radius:8px;margin:12px 0;font-weight:700;line-height:1.4}
.check input{width:23px;height:23px;flex:none}
.success{text-align:center}
.tick{width:76px;height:76px;margin:18px auto;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:46px}
.audio-tools{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}
.audio-tools[hidden]{display:none}
.audio-btn{background:#eaf3ff;color:var(--navy);border:2px solid var(--blue);padding:11px 13px;font-size:14px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.audio-status{font-size:13px;color:#5f6b76;min-height:20px;margin:0 0 12px}
.meta{font-size:12px;color:#5f6b76;margin-top:20px}
.draft{background:#fde8e7;border:2px solid var(--red);color:var(--red);font-weight:800;padding:10px 12px;border-radius:6px;margin:0 0 14px;font-size:14px;line-height:1.35}
.draft[hidden]{display:none}
.ver{font-size:11px;color:#8a949e;margin-top:26px}
@media(max-width:380px){.langgrid{grid-template-columns:1fr}h1{font-size:24px}header b{font-size:20px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head>

u site les prestataires qui ne respectent pas les règles ou les procédures de sécurité."], ["Alarme incendie", "Si l'alarme incendie retentit, toutes les personnes doivent quitter le bâtiment par la sortie de secours la plus proche. Les chauffeurs doivent garer immédiatement leur véhicule dans un endroit sûr, à l'écart des voies d'évacuation. Les clés doivent rester sur le contact au cas où les services de secours devraient déplacer le véhicule."]], "comms": [["Ne restez pas dans la cabine", "Vous ne pouvez pas rester dans votre cabine pendant le déchargement de votre véhicule."], ["Utilisez les espaces d'attente", "Des sièges se trouvent au coin du bâtiment. Les toilettes et un distributeur automatique sont à votre gauche."], ["Portez un gilet bien visible", "Si vous êtes à l'extérieur, assurez-vous que votre gilet haute visibilité vous rend visible sur 360 degrés."], ["Restez éloigné de la cabine", "Ne vous approchez pas de votre cabine, sauf si on vous le demande."], ["Utilisez les allées piétonnes", "Restez sur les allées piétonnes."], ["Attendez le Goods-In", "Un collègue du Goods-In viendra vous trouver en cas de problème, et lorsque vous aurez terminé, avec vos clés et vos documents."]]}, "ro": {"ui": {"title": "Siguranța șoferilor, centrul Worksop", "sub": "Siguranța șoferilor: pilot", "read": "🔊 Ascultă această pagină", "stop": "■ Oprește", "reading": "Pagina este citită cu voce tare.", "finished": "Citirea s-a încheiat.", "stopped": "Citirea a fost oprită.", "noSpeech": "Citirea vocală nu este disponibilă pe acest dispozitiv. Cereți ajutor la Goods-In.", "noVoice": "Nu există voce pentru această limbă pe acest dispozitiv. Cereți ajutor la Goods-In.", "err": "Citirea nu a putut porni. Cereți ajutor la Goods-In.", "loading": "Vocile se încarcă încă. Apăsați din nou butonul.", "welcomeH1": "Bun venit la Centrul de Distribuție Worksop", "welcomeP": "Citiți regulile de siguranță ale incintei și instrucțiunile Goods-In înainte de a continua.", "noteB": "Informaț const ORDER=['en','fr','ro','pl','ru'];
const NAMES={en:'English',fr:'Français',ro:'Română',pl:'Polski',ru:'Русский'};
/* A language goes live only when its translation has been independently reviewed. Set to true after sign-off. */
const REVIEWED={en:true,fr:false,ro:false,pl:false,ru:false};
const SPEECH={en:'en-GB',fr:'fr-FR',ro:'ro-RO',pl:'pl-PL',ru:'ru-RU'};
/* Reviewers open the page with ?review=1 to test unreviewed drafts. Drivers never see this. */
const PREVIEW=/[?&]review=1(&|$)/.test(location.search);
const TOTAL=7;
let lang='en',playId=0,current=1;
const AUDIO={};
/* Recorded audio is optional. When a driver picks a language, the page checks which files exist in audio/<language>/ and uses them. */
async function probeAudio(code){
  if(AUDIO[code])return;
  AUDIO[code]={};
  await Promise.all(['s2','s3','s4','s5','s6','s7'].map(async s=>{
    try{const r=await fetch('audio/'+code+'/'+s+'.mp3',{method:'HEAD'});if(r.ok)AUDIO[code][s]='audio/'+code+'/'+s+'.mp3';}catch(e){}
  }));
}
const $=id=>document.getElementById(id);
const ui=k=>DATA[lang].ui[k];

function renderRules(id,rows,start){
  const box=$(id);box.textContent='';
  rows.forEach((r,i)=>{
    const rule=document.createElement('div');rule.className='rule';
    const n=document.createElement('div');n.className='num';n.textContent=String(start+i);
    const w=document.createElement('div');
    const h=document.createElement('h3');h.textContent=r[0];
    const p=document.createElement('p');p.textContent=r[1];
    w.append(h,p);rule.append(n,w);box.append(rule);
  });
}
function buildLangGrid(){
  const g=$('langGrid');g.textContent='';
  ORDER.forEach(code=>{
    const b=document.createElement('button');b.type='button';b.className='lang';
    b.append(document.createTextNode(NAMES[code]));
    const ok=REVIEWED[code]||PREVIEW;
    if(!REVIEWED[code]){const s=document.createElement('span');s.textContent=PREVIEW?'Draft: reviewer preview':'Pending translation review';b.append(s);}
    b.disabled=!ok;
    b.setAttribute('lang',code);
    if(ok)b.addEventListener('click',()=>chooseLang(code));
    g.append(b);
  });
}
function applyLang(){
  document.documentElement.lang=lang;
  document.title=ui('title');
  document.querySelectorAll('[data-k]').forEach(el=>{el.textContent=ui(el.dataset.k);});
  $('readBtn').setAttribute('aria-label',ui('read').replace(/[^\p{L}\p{N}\s]/gu,'').trim());
  $('stopBtn').setAttribute('aria-label',ui('stop').replace(/[^\p{L}\p{N}\s]/gu,'').trim());
  renderRules('a',DATA[lang].site.slice(0,10),1);
  renderRules('b',DATA[lang].site.slice(10),11);
  renderRules('c',DATA[lang].comms,1);
  $('draftBanner').hidden=REVIEWED[lang];
}
function chooseLang(code){stopReading(true);lang=code;applyLang();probeAudio(code);go(2);}
function go(n){
  current=n;
  stopReading(true);
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  $('s'+n).classList.add('active');
  $('progress').style.width=(n/TOTAL*100)+'%';
  $('audioTools').hidden=(n===1);
  $('audioStatus').textContent='';
  scrollTo(0,0);
}
function check(){$('agree').disabled=![...document.querySelectorAll('#s6 input')].every(x=>x.checked);}
function resetApp(){document.querySelectorAll('input').forEach(x=>x.checked=false);check();lang='en';applyLang();go(1);}

/* ---------- Voice ---------- */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
function norm(l){return String(l||'').replace('_','-').toLowerCase();}
/* Prefer natural-sounding voices over basic ones. Phones differ, so the best available voice for the language is used. */
function voiceScore(v,want){
  const n=String(v.name||'').toLowerCase();let s=0;
  if(norm(v.lang)===want)s+=10;
  if(/natural|neural|premium|enhanced|wavenet|siri/.test(n))s+=8;
  if(/google/.test(n))s+=4;
  if(/compact|espeak|novelty|eloquence|default/.test(n))s-=8;
  if(v.localService===true)s+=1;
  return s;
}
function pickVoice(){
  if(!synth)return null;
  const want=norm(SPEECH[lang]),base=want.split('-')[0];
  const vs=synth.getVoices().filter(v=>norm(v.lang).split('-')[0]===base);
  if(!vs.length)return null;
  return vs.map(v=>[voiceScore(v,want),v]).sort((a,b)=>b[0]-a[0])[0][1];
}
function waitForVoices(ms){
  return new Promise(res=>{
    if(synth.getVoices().length)return res();
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    synth.addEventListener('voiceschanged',fin,{once:true});
    setTimeout(fin,ms);
  });
}
/* Text is read one sentence at a time with short pauses, which sounds less robotic than one long block. */
const RATE=0.94;
function sentences(t){
  const m=t.match(/[^.!?]+[.!?]+["\u201d\u00bb)]*|[^.!?]+$/g);
  return (m||[t]).map(x=>x.trim()).filter(Boolean);
}
function pageChunks(){
  const sc=document.querySelector('.screen.active'),out=[];
  sc.querySelectorAll('h1,h2,h3,p,.note,.check').forEach(e=>{
    let t=e.textContent.replace(/[\u{1F300}-\u{1FAFF}\u2713]/gu,'').replace(/\s+/g,' ').trim();
    if(!t)return;
    if(!/[.!?:;]$/.test(t))t+='.';
    const end=e.tagName==='H1'?700:e.tagName==='H2'?550:e.tagName==='H3'?350:650;
    const ss=sentences(t);
    ss.forEach((x,i)=>out.push({t:x,gap:i===ss.length-1?end:250}));
  });
  return out;
}
let player=null;
function stopAudioEl(){
  if(player){player.onplaying=player.onended=player.onerror=null;try{player.pause();}catch(e){}player=null;}
}
function stopReading(silent){
  playId++;
  stopAudioEl();
  if(synth)synth.cancel();
  if(!silent)$('audioStatus').textContent=ui('stopped');
}
/* Recorded audio: used when a file exists for this language and page. Otherwise the phone's own voice reads the text. */
function playFile(path){
  const st=$('audioStatus'),my=++playId;
  stopAudioEl();
  const a=new Audio(path);player=a;a.preload='auto';
  a.onplaying=()=>{if(my===playId)st.textContent=ui('reading');};
  a.onended=()=>{if(my===playId){st.textContent=ui('finished');player=null;}};
  const fail=()=>{if(my!==playId)return;player=null;speakDevice();};
  a.onerror=fail;
  const p=a.play();
  if(p&&p.catch)p.catch(fail);
}
async function speakDevice(){
  const st=$('audioStatus');
  if(!synth){st.textContent=ui('noSpeech');return;}
  synth.cancel();
  const my=++playId;
  let voice=pickVoice();
  if(!voice&&synth.getVoices().length===0){
    st.textContent=ui('loading');
    await waitForVoices(1500);
    if(my!==playId)return;
    voice=pickVoice();
  }
  if(!voice){st.textContent=ui('noVoice');return;}
  const items=pageChunks();
  if(!items.length){return;}
  let i=0;
  const next=()=>{
    if(my!==playId)return;
    if(i>=items.length){st.textContent=ui('finished');return;}
    const it=items[i++];
    let moved=false;
    const go2=()=>{if(moved||my!==playId)return;moved=true;clearTimeout(dog);setTimeout(next,it.gap);};
    const dog=setTimeout(go2,4000+it.t.length*110);   /* safety net if a phone never reports the end of speech */
    const u=new SpeechSynthesisUtterance(it.t);
    u.voice=voice;u.lang=voice.lang;u.rate=RATE;u.pitch=1;
    if(i===1)u.onstart=()=>{if(my===playId)st.textContent=ui('reading');};
    u.onend=go2;
    u.onerror=e=>{if(my!==playId)return;if(e.error==='interrupted'||e.error==='canceled')return;clearTimeout(dog);st.textContent=ui('err');};
    synth.speak(u);
  };
  next();
}
function readCurrent(){
  stopReading(true);
  const f=AUDIO[lang]&&AUDIO[lang]['s'+current];
  if(f){playFile(f);return;}
  speakDevice();
}
$('readBtn').addEventListener('click',readCurrent);
$('stopBtn').addEventListener('click',()=>stopReading(false));
if(synth){synth.getVoices();synth.addEventListener('voiceschanged',()=>synth.getVoices());}

buildLangGrid();applyLang();go(1);
</script></body></html>
